name: Publish isolated Compose candidate
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify immutable candidate files
        working-directory: candidates/0.74-native.1
        run: |
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PYTHON'
          import json, pathlib, hashlib
          info=json.loads(pathlib.Path('build-info.json').read_text())
          assert info['packageId']=='ru.local.spbumailpilot'
          assert info['versionName']=='0.74-native.1' and info['versionCode']==90
          assert info['certificateSha256']=='197ecdabd94c7217afa45df6f02300f1f0ff12474b3146fc4018a3adbb8ce7b6'
          assert info['sha256']==hashlib.sha256(pathlib.Path('spbu-mail-pilot-0.74-native.1.apk').read_bytes()).hexdigest()
          PYTHON
      - name: Publish separate prerelease without changing stable channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.74-native.1
          candidates/0.74-native.1/spbu-mail-pilot-0.74-native.1.apk
          candidates/0.74-native.1/SHA256SUMS.txt
          candidates/0.74-native.1/build-info.json
          candidates/0.74-native.1/previews.zip
          candidates/0.74-native.1/spbu-mail-pilot-0.74-native.1-source.zip
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title '0.74-native.1 — Compose: темы и цветные аватары'
          --notes-file candidates/0.74-native.1/release-notes.md
          --prerelease --latest=false
