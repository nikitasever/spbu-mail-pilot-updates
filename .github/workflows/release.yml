name: Publish isolated desktop preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify immutable Windows candidate
        working-directory: candidates/desktop-0.1.0-preview.1
        run: |
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PYTHON'
          import json,pathlib,hashlib
          p=pathlib.Path('.')
          info=json.loads((p/'build-info.json').read_text())
          assert info['sourceCommit']=='dfa428bcbec8821c3ad6a3e16b65f34c878e9026'
          assert info['buildRun']==40760245789 and info['platform']=='windows-x64'
          assert info['sha256']==hashlib.sha256((p/info['file']).read_bytes()).hexdigest()
          proof=json.loads((p/'install-proof.json').read_text())
          assert proof['installed'] and proof['windowOpened'] and proof['jvmStoppedOnExit']
          PYTHON
      - name: Publish separate desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create desktop-v0.1.0-preview.1
          candidates/desktop-0.1.0-preview.1/spbu-mail-desktop-0.1.0-preview.1-windows-x64-setup.exe
          candidates/desktop-0.1.0-preview.1/spbu-mail-desktop-0.1.0-preview.1-source.zip
          candidates/desktop-0.1.0-preview.1/Cargo.lock
          candidates/desktop-0.1.0-preview.1/build-info.json
          candidates/desktop-0.1.0-preview.1/install-proof.json
          candidates/desktop-0.1.0-preview.1/windows-login.png
          candidates/desktop-0.1.0-preview.1/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title 'Windows 0.1.0 preview 1 — локальная почта: папки и чтение'
          --notes-file candidates/desktop-0.1.0-preview.1/release-notes.md
          --prerelease --latest=false
